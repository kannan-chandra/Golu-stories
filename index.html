<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A compact, child-friendly collection of stories from Hindu tradition." />
    <title>Golu Stories</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="stories.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./" aria-label="Golu Stories home">
          <span class="brand-mark" aria-hidden="true">கொலு</span>
          <span>Golu Stories</span>
        </a>
        <p>Stories from Hindu tradition, made easy to browse.</p>
      </div>
    </header>

    <main id="top">
      <section class="browse" aria-label="Browse stories">
        <h1 class="sr-only">Golu Stories</h1>
        <div class="toolbar">
          <label class="search">
            <span class="sr-only">Search stories</span>
            <span aria-hidden="true">⌕</span>
            <input id="search" type="search" placeholder="Search a name or story…" autocomplete="off" />
          </label>
          <button id="clear" class="clear-button" type="button" hidden>Clear</button>
        </div>
        <div id="filters" class="filters" aria-label="Filter by character"></div>
        <p id="result-count" class="result-count" aria-live="polite"></p>
        <div id="story-grid" class="story-grid"></div>
        <div id="empty-state" class="empty-state" hidden>
          <p>No stories match that search.</p>
          <button type="button">Show all stories</button>
        </div>
      </section>

      <article id="story-page" class="story-page" hidden>
        <a class="back-link" href="./">← Back to all stories</a>
        <p id="story-index" class="audit-index"></p>
        <p id="story-category" class="eyebrow"></p>
        <h1 id="story-title"></h1>
        <div id="story-body" class="story-body"></div>
        <div class="story-end">
          <a class="back-link" href="./">← Back to all stories</a>
        </div>
      </article>
    </main>

    <footer>
      <p>Stories and notes adapted from the supplied family collection. Traditional tellings can vary across regions and texts.</p>
    </footer>
  </body>
</html>
